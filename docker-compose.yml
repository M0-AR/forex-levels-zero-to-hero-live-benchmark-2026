services:
  research:
    build: .
    container_name: forex-levels-benchmark
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    command: python3 src/run_all.py --config config.yaml
  # Optional: Jupyter for interactive exploration of the same verified pipeline
  lab:
    build: .
    container_name: forex-levels-lab
    ports:
      - "8888:8888"
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./src:/app/src
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    profiles: ["lab"]
